name: Keep Supabase Alive

on:
  schedule:
    # Chạy tự động mỗi 3 ngày lúc 04:00 UTC (11:00 AM VN) để reset bộ đếm 7 ngày của Supabase Free Tier
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công từ tab Actions trên GitHub bất cứ lúc nào

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set yet in GitHub Secrets. Skipping DB direct ping."
          else
            npm install -g pg
            node -e "
              const { Client } = require('pg');
              const client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false }
              });
              client.connect()
                .then(() => {
                  console.log('Connected to Supabase PostgreSQL successfully!');
                  return client.query('SELECT NOW() AS ping_time;');
                })
                .then((res) => {
                  console.log('Keep-alive ping success at:', res.rows[0].ping_time);
                  return client.end();
                })
                .catch((err) => {
                  console.error('Ping failed:', err.message);
                  process.exit(1);
                });
            "
          fi
